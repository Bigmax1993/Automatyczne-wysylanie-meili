name: Deploy UA Discovery fix

on:
  push:
    branches: [main]
    paths:
      - "deploy/ua-discovery-fix/**"
      - ".github/workflows/deploy-ua-discovery-fix.yml"
  workflow_dispatch:
    inputs:
      discovery_phase:
        description: "Faza discovery (tue, mon, ...)"
        required: false
        type: string
        default: tue
      resume_artifact_run_id:
        description: "Run ID do wznowienia (ua-materialy-wyniki-pi)"
        required: false
        type: string
        default: "29269564038"

permissions:
  contents: read
  actions: read

env:
  SCRAPER_TIMEZONE: Europe/Warsaw
  DISABLE_SEND_WINDOW: "1"
  SERPER_DAILY_LIMIT: "1000"
  CLAUDE_UNLIMITED: "1"
  SCRAPER_MAX_RUNTIME_SECONDS: "14400"
  UA_REGIONAL_INQUIRY_EMAIL_FROM: "2026-07-13"

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 310
    env:
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Checkout deploy scripts
        uses: actions/checkout@v4

      - name: Checkout UA repo (public)
        uses: actions/checkout@v4
        with:
          repository: Bigmax1993/wyszukiwarka-materialow-budowlanych-ukraina
          path: ua-repo

      - name: Apply discovery fix
        run: python3 deploy/ua-discovery-fix/apply_fix.py ua-repo/ua_materialy_scraper.py

      - name: Set up Python scraper
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ua-repo/requirements.txt

      - name: Install scraper dependencies
        working-directory: ua-repo
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps
        env:
          KANBUD_PROJECT_ROOT: ${{ github.workspace }}/ua-repo/libs

      - name: Push fix to UA master (optional)
        if: secrets.UA_REPO_TOKEN
        working-directory: ua-repo
        env:
          GH_TOKEN: ${{ secrets.UA_REPO_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ua_materialy_scraper.py
          if git diff --staged --quiet; then
            echo "No changes to push"
          else
            git commit -m "Fix serper-only discovery: defer Claude www verify to Sunday"
            git push "https://x-access-token:${GH_TOKEN}@github.com/Bigmax1993/wyszukiwarka-materialow-budowlanych-ukraina.git" HEAD:master
          fi

      - name: Download previous Wyniki (optional)
        if: secrets.UA_REPO_TOKEN
        uses: actions/download-artifact@v4
        with:
          name: ua-materialy-wyniki-pi
          github-token: ${{ secrets.UA_REPO_TOKEN }}
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_artifact_run_id || '29269564038' }}
          path: ua-repo
        continue-on-error: true

      - name: Discovery (serper-only, patched)
        working-directory: ua-repo
        env:
          KANBUD_PROJECT_ROOT: ${{ github.workspace }}/ua-repo/libs
        run: |
          if [ -z "$SERPER_API_KEY" ] || [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Brak SERPER_API_KEY lub ANTHROPIC_API_KEY w secrets repo Automatyczne-wysylanie-meili"
            exit 1
          fi
          PHASE="${{ github.event_name == 'workflow_dispatch' && inputs.discovery_phase || 'tue' }}"
          ARGS="--run-config run_config/ua_materialy.json --serper-only-discovery --no-auto-email --rotate-oblast"
          if [ "$PHASE" != "mon" ]; then
            ARGS="$ARGS --respect-cache"
          fi
          python ua_materialy_scraper.py $ARGS

      - name: Upload Wyniki artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ua-materialy-wyniki-pi-proxy-${{ github.run_id }}
          path: |
            ua-repo/Wyniki/
            ua-repo/wyslane/
          if-no-files-found: warn
