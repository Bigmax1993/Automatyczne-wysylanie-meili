name: Deploy UA Discovery fix

on:
  workflow_dispatch:
    inputs:
      discovery_phase:
        description: "Faza discovery (tue, mon, ...)"
        required: false
        type: string
        default: tue
      resume_artifact_run_id:
        description: "Run ID do wznowienia (ua-materialy-wyniki-pi)"
        required: false
        type: string
        default: "29269564038"

permissions:
  contents: read

jobs:
  deploy-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Checkout UA repo (public)
        uses: actions/checkout@v4
        with:
          repository: Bigmax1993/wyszukiwarka-materialow-budowlanych-ukraina
          path: ua-repo

      - name: Apply discovery fix
        run: python3 deploy/ua-discovery-fix/apply_fix.py ua-repo/ua_materialy_scraper.py

      - name: Push fix to UA master
        working-directory: ua-repo
        env:
          GH_TOKEN: ${{ secrets.UA_REPO_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Brak UA_REPO_TOKEN. Dodaj PAT (contents:write + actions:write) w Settings → Secrets repo Automatyczne-wysylanie-meili. Sekrety SERPER/ANTHROPIC są w repo UA — discovery musi lecieć tam."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ua_materialy_scraper.py
          if git diff --staged --quiet; then
            echo "Fix już na master UA"
          else
            git commit -m "Fix serper-only discovery: defer Claude www verify to Sunday"
            git push "https://x-access-token:${GH_TOKEN}@github.com/Bigmax1993/wyszukiwarka-materialow-budowlanych-ukraina.git" HEAD:master
          fi

      - name: Trigger UA discovery (sekrety SERPER/ANTHROPIC z repo UA)
        env:
          GH_TOKEN: ${{ secrets.UA_REPO_TOKEN }}
        run: |
          gh workflow run ua_materialy_pi.yml \
            -R Bigmax1993/wyszukiwarka-materialow-budowlanych-ukraina \
            -f discovery_phase="${{ inputs.discovery_phase }}" \
            -f resume_artifact_run_id="${{ inputs.resume_artifact_run_id }}"
