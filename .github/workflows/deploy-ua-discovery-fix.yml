name: Deploy UA Discovery fix

on:
  push:
    branches: [main]
    paths:
      - "deploy/ua-discovery-fix/**"
      - ".github/workflows/deploy-ua-discovery-fix.yml"
  workflow_dispatch:
    inputs:
      discovery_phase:
        description: "Faza discovery (tue, mon, ...)"
        required: false
        type: string
        default: tue

permissions:
  contents: read

env:
  SCRAPER_TIMEZONE: Europe/Warsaw
  DISABLE_SEND_WINDOW: "1"
  SERPER_DAILY_LIMIT: "1000"
  CLAUDE_UNLIMITED: "1"
  SCRAPER_MAX_RUNTIME_SECONDS: "14400"
  UA_REGIONAL_INQUIRY_EMAIL_FROM: "2026-07-13"

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 310
    env:
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Checkout deploy scripts
        uses: actions/checkout@v4

      - name: Checkout UA repo (public)
        uses: actions/checkout@v4
        with:
          repository: Bigmax1993/wyszukiwarka-materialow-budowlanych-ukraina
          path: ua-repo

      - name: Apply discovery fix
        run: python3 deploy/ua-discovery-fix/apply_fix.py ua-repo/ua_materialy_scraper.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ua-repo/requirements.txt

      - name: Install scraper dependencies
        working-directory: ua-repo
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps

      - name: Discovery (serper-only, patched)
        working-directory: ua-repo
        env:
          KANBUD_PROJECT_ROOT: ${{ github.workspace }}/ua-repo/libs
        run: |
          if [ -z "$SERPER_API_KEY" ] || [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Dodaj secrets SERPER_API_KEY i ANTHROPIC_API_KEY w repo Automatyczne-wysylanie-meili"
            exit 1
          fi
          PHASE="${{ github.event_name == 'workflow_dispatch' && inputs.discovery_phase || 'tue' }}"
          ARGS="--run-config run_config/ua_materialy.json --serper-only-discovery --no-auto-email --rotate-oblast"
          if [ "$PHASE" != "mon" ]; then
            ARGS="$ARGS --respect-cache"
          fi
          python ua_materialy_scraper.py $ARGS

      - name: Upload Wyniki artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ua-materialy-wyniki-pi-proxy-${{ github.run_id }}
          path: |
            ua-repo/Wyniki/
            ua-repo/wyslane/
          if-no-files-found: warn
