# Wysyłka prognoz z repo prognoza-meczy (proxy — działa bez pusha do tamtego repo).
name: Prognoza-meczy wysyłka Gmail

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      use_repo_xlsx_only:
        description: "Użyj predykcje_2026.xlsx z main (bez artifactu pipeline)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONIOENCODING: utf-8
      PROGNOZA_REPO: Bigmax1993/prognoza-meczy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Przygotuj sekrety Gmail
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_SENDER_EMAIL: ${{ secrets.GMAIL_SENDER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          set -euo pipefail
          USER="${GMAIL_USER:-$GMAIL_SENDER_EMAIL}"
          if [ -z "$USER" ] || [ -z "$GMAIL_APP_PASSWORD" ] || [ -z "$MAIL_TO" ]; then
            echo "::error::Ustaw sekrety: GMAIL_USER (lub GMAIL_SENDER_EMAIL), GMAIL_APP_PASSWORD, MAIL_TO"
            exit 1
          fi
          echo "GMAIL_USER=$USER" >> "$GITHUB_ENV"
          echo "GMAIL_APP_PASSWORD=$GMAIL_APP_PASSWORD" >> "$GITHUB_ENV"
          echo "MAIL_TO=$MAIL_TO" >> "$GITHUB_ENV"

      - name: Pobierz Excel (artifact pipeline lub fallback z repo)
        env:
          P1: ${{ secrets.PROGNOZA_MECZY_PAT }}
          P2: ${{ secrets.GITHUB_PAT }}
          P3: ${{ secrets.GH_PAT }}
          USE_REPO_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.use_repo_xlsx_only == true }}
        run: |
          set -euo pipefail
          TOKEN=""
          [ -n "$P1" ] && TOKEN="$P1"
          [ -z "$TOKEN" ] && [ -n "$P2" ] && TOKEN="$P2"
          [ -z "$TOKEN" ] && [ -n "$P3" ] && TOKEN="$P3"

          if [ "$USE_REPO_ONLY" = "true" ]; then
            echo "Ręczny tryb: pobieram xlsx z repo main."
            curl -fsSL "https://raw.githubusercontent.com/${PROGNOZA_REPO}/main/predykcje_2026.xlsx" -o predykcje_2026.xlsx
            exit 0
          fi

          if [ -n "$TOKEN" ]; then
            curl -fsSL "https://raw.githubusercontent.com/${PROGNOZA_REPO}/main/predykcje_2026.xlsx" -o predykcje_repo.xlsx
            export GITHUB_TOKEN="$TOKEN"
            if python3 deploy/prognoza-meczy-send-mail/scripts/fetch_predykcje_artifact.py \
              --repo "$PROGNOZA_REPO" \
              --branch main \
              --dest predykcje_2026.xlsx \
              --fallback predykcje_repo.xlsx; then
              test -f predykcje_2026.xlsx
              exit 0
            fi
            echo "::warning::Artifact niedostępny — fallback na plik z repo main."
            cp predykcje_repo.xlsx predykcje_2026.xlsx
          else
            echo "::warning::Brak PAT (PROGNOZA_MECZY_PAT/GITHUB_PAT) — używam pliku z repo main."
          fi

          curl -fsSL "https://raw.githubusercontent.com/${PROGNOZA_REPO}/main/predykcje_2026.xlsx" -o predykcje_2026.xlsx
          test -f predykcje_2026.xlsx

      - name: Wyślij mail
        run: python3 deploy/prognoza-meczy-send-mail/send_mail.py --plik predykcje_2026.xlsx
