# Wysyłka prognoz — wymaga sekretów GMAIL_* i MAIL_TO w TYM repo (Automatyczne-wysylanie-meili).
# Sekrety z repo prognoza-meczy nie są tu dostępne. Do wysyłki użyj workflow w prognoza-meczy.
name: Prognoza-meczy wysyłka Gmail (proxy)

on:
  workflow_dispatch:
    inputs:
      use_repo_xlsx_only:
        description: "Użyj predykcje_2026.xlsx z main (bez artifactu pipeline)"
        required: false
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - "deploy/prognoza-meczy-send-mail/.trigger-send"

permissions:
  contents: read
  actions: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONIOENCODING: utf-8
      PROGNOZA_REPO: Bigmax1993/prognoza-meczy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Przygotuj sekrety Gmail (repo Automatyczne-wysylanie-meili)
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_SENDER_EMAIL: ${{ secrets.GMAIL_SENDER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          set -euo pipefail
          USER="${GMAIL_USER:-$GMAIL_SENDER_EMAIL}"
          missing=""
          [ -z "$USER" ] && missing="${missing} GMAIL_USER lub GMAIL_SENDER_EMAIL"
          [ -z "$GMAIL_APP_PASSWORD" ] && missing="${missing} GMAIL_APP_PASSWORD"
          [ -z "$MAIL_TO" ] && missing="${missing} MAIL_TO"
          if [ -n "$missing" ]; then
            echo "::error::Brak sekretów w repo Automatyczne-wysylanie-meili:$missing"
            echo "::error::Sekrety dodane do prognoza-meczy NIE działają w tym repo."
            echo "::error::Uruchom zamiast tego: prognoza-meczy → Actions → Wysyłka Gmail poniedziałek → Run workflow"
            exit 1
          fi
          echo "GMAIL_USER=$USER" >> "$GITHUB_ENV"
          echo "GMAIL_APP_PASSWORD=$GMAIL_APP_PASSWORD" >> "$GITHUB_ENV"
          echo "MAIL_TO=$MAIL_TO" >> "$GITHUB_ENV"

      - name: Pobierz Excel
        env:
          S1: ${{ secrets.PROGNOZA_MECZY_PAT }}
          S2: ${{ secrets.GITHUB_PAT }}
          S3: ${{ secrets.GH_PAT }}
          S4: ${{ secrets.PAT }}
          USE_REPO_ONLY: ${{ inputs.use_repo_xlsx_only }}
        run: |
          set -euo pipefail
          TOKEN=""
          for candidate in "$S1" "$S2" "$S3" "$S4"; do
            [ -n "$candidate" ] && TOKEN="$candidate" && break
          done

          if [ "$USE_REPO_ONLY" = "true" ] || [ -z "$TOKEN" ]; then
            curl -fsSL "https://raw.githubusercontent.com/${PROGNOZA_REPO}/main/predykcje_2026.xlsx" -o predykcje_2026.xlsx
            test -f predykcje_2026.xlsx
            exit 0
          fi

          curl -fsSL "https://raw.githubusercontent.com/${PROGNOZA_REPO}/main/predykcje_2026.xlsx" -o predykcje_repo.xlsx
          export GITHUB_TOKEN="$TOKEN"
          python3 deploy/prognoza-meczy-send-mail/scripts/fetch_predykcje_artifact.py \
            --repo "$PROGNOZA_REPO" \
            --branch main \
            --dest predykcje_2026.xlsx \
            --fallback predykcje_repo.xlsx
          test -f predykcje_2026.xlsx

      - name: Wyślij mail
        run: python3 deploy/prognoza-meczy-send-mail/send_mail.py --plik predykcje_2026.xlsx
