name: Apply prognoza-meczy send-mail fix

on:
  workflow_dispatch:
    inputs:
      github_pat:
        description: "PAT (scope repo) do push na prognoza-meczy"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "deploy/prognoza-send-mail-fix/**"
      - ".github/workflows/apply-prognoza-send-mail-fix.yml"

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Push poprawkę send-mail.yml
        env:
          INPUT_PAT: ${{ inputs.github_pat }}
          S1: ${{ secrets.PROGNOZA_MECZY_PAT }}
          S2: ${{ secrets.GITHUB_PAT }}
          S3: ${{ secrets.GH_PAT }}
          S4: ${{ secrets.PAT }}
        run: |
          set -euo pipefail
          TOKEN=""
          for candidate in "$INPUT_PAT" "$S1" "$S2" "$S3" "$S4"; do
            [ -n "$candidate" ] && TOKEN="$candidate" && break
          done
          if [ -z "$TOKEN" ]; then
            echo "::error::Brak PAT. Dodaj PROGNOZA_MECZY_PAT w Secrets lub uruchom workflow_dispatch z polem github_pat."
            exit 1
          fi
          work="$(mktemp -d)"
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
            clone --depth 1 "https://x-access-token:${TOKEN}@github.com/Bigmax1993/prognoza-meczy.git" "$work/repo"
          cp deploy/prognoza-send-mail-fix/send-mail.yml "$work/repo/.github/workflows/send-mail.yml"
          cd "$work/repo"
          git add .github/workflows/send-mail.yml
          if git diff --staged --quiet; then
            echo "prognoza-meczy już ma poprawkę send-mail.yml"
            exit 0
          fi
          git commit -m "Fix send-mail: remove stale xlsx before artifact download."
          git push origin main
          echo "Wypchnięto poprawkę na prognoza-meczy/main"

      - name: Uruchom wysyłkę
        env:
          INPUT_PAT: ${{ inputs.github_pat }}
          S1: ${{ secrets.PROGNOZA_MECZY_PAT }}
          S2: ${{ secrets.GITHUB_PAT }}
          S3: ${{ secrets.GH_PAT }}
          S4: ${{ secrets.PAT }}
        run: |
          set -euo pipefail
          TOKEN=""
          for candidate in "$INPUT_PAT" "$S1" "$S2" "$S3" "$S4"; do
            [ -n "$candidate" ] && TOKEN="$candidate" && break
          done
          [ -z "$TOKEN" ] && exit 0
          code=$(curl -s -o /tmp/dispatch.json -w "%{http_code}" -X POST \
            -H "Authorization: token ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Bigmax1993/prognoza-meczy/actions/workflows/send-mail.yml/dispatches" \
            -d '{"ref":"main"}')
          if [ "$code" != "204" ]; then
            echo "::error::Nie udało się uruchomić wysyłki (HTTP $code)"
            cat /tmp/dispatch.json
            exit 1
          fi
          echo "Uruchomiono Wysyłka Gmail poniedziałek"
