name: CI + Pipeline

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_pipeline:
        description: "Run pipeline job in this workflow"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      skip_build:
        description: "Skip SerpAPI build stage"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      dry_run:
        description: "Run pipeline without SMTP send"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
  schedule:
    # Sunday 19:00 UTC - SerpAPI only
    - cron: "0 19 * * 0"
    # Monday 02:00 UTC - full pipeline (dry-run by default)
    - cron: "0 2 * * 1"

jobs:
  test-python:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run pytest
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          DRY_RUN: "1"
        run: python -m pytest tests -v --tb=short

