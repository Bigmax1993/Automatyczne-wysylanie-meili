name: CI + Pipeline

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_pipeline:
        description: "Run pipeline job in this workflow"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      skip_build:
        description: "Skip SerpAPI build stage"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      dry_run:
        description: "Run pipeline without SMTP send"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
  schedule:
    # Sunday 19:00 UTC - SerpAPI only
    - cron: "0 19 * * 0"
    # Monday 02:00 UTC - full pipeline (dry-run by default)
    - cron: "0 2 * * 1"

jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run pytest
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          DRY_RUN: "1"
        run: python -m pytest tests -v --tb=short

  test-powershell:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Pester tests
        shell: pwsh
        env:
          # Jawny root repozytorium dla testow (PSScriptRoot w Pester/pwsh bywa zawodny).
          REPO_ROOT: ${{ github.workspace }}
        run: |
          $ProgressPreference = "SilentlyContinue"
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          # pwsh ma czesto Pester 5 z legacy Should (Should Be) wylaczonym — testy uzywaja skladni Pester 3/4.
          Install-Module Pester -RequiredVersion 4.10.1 -Force -SkipPublisherCheck -Scope CurrentUser -AllowClobber
          Remove-Module Pester -Force -ErrorAction SilentlyContinue
          Import-Module Pester -RequiredVersion 4.10.1 -Force
          if ((Get-Module Pester).Version.ToString() -ne "4.10.1") {
            throw "Oczekiwano Pester 4.10.1, jest: $((Get-Module Pester).Version)"
          }
          Set-Location -LiteralPath $env:REPO_ROOT
          $r1 = Invoke-Pester -Path ".\tests\powershell\RunPipeline.Tests.ps1" -PassThru
          $r2 = Invoke-Pester -Path ".\tests\powershell\RunWithEnv.Tests.ps1" -PassThru
          $failed = [int]$r1.FailedCount + [int]$r2.FailedCount
          if ($failed -gt 0) { exit $failed }

  serpapi-sunday:
    if: github.event_name == 'schedule' && github.event.schedule == '0 19 * * 0'
    runs-on: ubuntu-latest
    needs: [test-python]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run SerpAPI build
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: |
          python build_contacts_serpapi.py --firm-target 200 --agency-target 200 --ecommerce-target 200 --cities "Wroclaw,Zielona Gora,Poznan" --output "$HOME/Kontakty_serpapi.xlsx"

  pipeline:
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_pipeline == 'true') ||
      (github.event_name == 'schedule' && github.event.schedule == '0 2 * * 1')
    runs-on: windows-latest
    needs: [test-python, test-powershell]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare input sample
        shell: pwsh
        run: |
          $docsDir = Join-Path $env:USERPROFILE "Documents"
          $kontaktyDir = Join-Path $docsDir "kontakty"
          New-Item -ItemType Directory -Path $kontaktyDir -Force | Out-Null
          @"
          company_name,email,phone,url,source_query
          Test Company,test@example.com,,https://example.com,test query
          "@ | Out-File -FilePath (Join-Path $kontaktyDir "sample.csv") -Encoding utf8

      - name: Run pipeline
        shell: pwsh
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_SENDER_EMAIL: ${{ secrets.GMAIL_SENDER_EMAIL }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          PIPELINE_PYTHON_EXE: python
        run: |
          $skipBuild = "-SkipBuild"
          $dryRun = "-DryRun"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            if ("${{ github.event.inputs.skip_build }}" -eq "false") { $skipBuild = "" }
            if ("${{ github.event.inputs.dry_run }}" -eq "false") { $dryRun = "" }
          }
          $args = @()
          if ($skipBuild) { $args += $skipBuild }
          if ($dryRun) { $args += $dryRun }
          ./run_pipeline.ps1 @args
