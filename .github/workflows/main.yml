name: CI + Pipeline

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "build_contacts_serpapi.py"
      - "run_pipeline.ps1"
      - "requirements*.txt"
      - "tests/**"
      - ".github/workflows/main.yml"
      - ".github/workflows/schedule-serpapi-sunday.yml"
      - ".github/workflows/schedule-pipeline-monday.yml"
  pull_request:
    paths:
      - "build_contacts_serpapi.py"
      - "run_pipeline.ps1"
      - "requirements*.txt"
      - "tests/**"
      - ".github/workflows/main.yml"
      - ".github/workflows/schedule-serpapi-sunday.yml"
      - ".github/workflows/schedule-pipeline-monday.yml"
  workflow_dispatch:
    inputs:
      run_pipeline:
        description: "Legacy switch (pipeline now runs on every manual run)"
        required: false
        default: "true"
        type: choice
        options: ["false", "true"]
      skip_build:
        description: "Skip SerpAPI build stage"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      dry_run:
        description: "Run pipeline without SMTP send"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

jobs:
  test-python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run pytest
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          DRY_RUN: "1"
        run: python -m pytest tests -v --tb=short

  test-powershell:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Pester tests
        shell: pwsh
        env:
          # Jawny root repozytorium dla testow (PSScriptRoot w Pester/pwsh bywa zawodny).
          REPO_ROOT: ${{ github.workspace }}
        run: |
          $ProgressPreference = "SilentlyContinue"
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          # pwsh ma czesto Pester 5 z legacy Should (Should Be) wylaczonym — testy uzywaja skladni Pester 3/4.
          Install-Module Pester -RequiredVersion 4.10.1 -Force -SkipPublisherCheck -Scope CurrentUser -AllowClobber
          Remove-Module Pester -Force -ErrorAction SilentlyContinue
          Import-Module Pester -RequiredVersion 4.10.1 -Force
          if ((Get-Module Pester).Version.ToString() -ne "4.10.1") {
            throw "Oczekiwano Pester 4.10.1, jest: $((Get-Module Pester).Version)"
          }
          Set-Location -LiteralPath $env:REPO_ROOT
          $r1 = Invoke-Pester -Path ".\tests\powershell\RunPipeline.Tests.ps1" -PassThru
          $r2 = Invoke-Pester -Path ".\tests\powershell\RunWithEnv.Tests.ps1" -PassThru
          $failed = [int]$r1.FailedCount + [int]$r2.FailedCount
          if ($failed -gt 0) { exit $failed }

  serpapi-sunday:
    # SerpAPI w niedziele: workflow schedule-serpapi-sunday.yml (jeden cron, strefa Europe/Warsaw).
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.skip_build == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [test-python]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run SerpAPI build
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: |
          python build_contacts_serpapi.py --firm-target 200 --agency-target 200 --ecommerce-target 200 --max-requests-per-group 0 --max-requests-total 200 --cities "Wroclaw,Zielona Gora,Poznan" --output "$HOME/Kontakty_serpapi.xlsx"

  pipeline:
    # Zaplanowany pipeline w poniedzialki: schedule-pipeline-monday.yml.
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      needs.test-python.result == 'success' &&
      needs.test-powershell.result == 'success' &&
      (needs.serpapi-sunday.result == 'success' || needs.serpapi-sunday.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs: [test-python, test-powershell, serpapi-sunday]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare input sample
        run: |
          DOCS_DIR="$HOME/Documents"
          KONTAKTY_DIR="$DOCS_DIR/kontakty"
          mkdir -p "$KONTAKTY_DIR"
          cat > "$KONTAKTY_DIR/sample.csv" <<'CSV'
          company_name,email,phone,url,source_query
          Test Company,test@example.com,,https://example.com,test query
          CSV

      - name: Run pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_SENDER_EMAIL: ${{ secrets.GMAIL_SENDER_EMAIL }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          PIPELINE_PYTHON_EXE: python
        run: |
          DOCS_DIR="$HOME/Documents"
          KONTAKTY_DIR="$DOCS_DIR/kontakty"
          INPUT_PATH="$DOCS_DIR/Kontakty_serpapi.xlsx"
          if [ ! -f "$INPUT_PATH" ]; then
            INPUT_PATH="$KONTAKTY_DIR/sample.csv"
          fi
          ARGS=(
            "--input" "$INPUT_PATH"
            "--output-csv" "$DOCS_DIR/Kontakty_cleaned.csv"
            "--extra-contacts-dir" "$KONTAKTY_DIR"
          )
          if [ "${{ github.event.inputs.dry_run }}" != "false" ]; then
            ARGS+=("--dry-run")
          fi
          python clean_validate_send_pipeline.py "${ARGS[@]}"

      - name: Upload pipeline JSON backups
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-json-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ~/Documents/pipeline_json_backups/*.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload pipeline logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ~/Documents/pipeline_logs/*.log
          if-no-files-found: ignore
          retention-days: 30
