name: Deploy prognoza-meczy send-mail fix

on:
  push:
    branches: [main]
    paths:
      - "deploy/prognoza-meczy-send-mail/**"
      - ".github/workflows/deploy-prognoza-send-mail.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Rozwiąż token deploy
        env:
          P1: ${{ secrets.PROGNOZA_MECZY_PAT }}
          P2: ${{ secrets.GITHUB_PAT }}
          P3: ${{ secrets.GH_PAT }}
        run: |
          TOKEN=""
          [ -n "$P1" ] && TOKEN="$P1"
          [ -z "$TOKEN" ] && [ -n "$P2" ] && TOKEN="$P2"
          [ -z "$TOKEN" ] && [ -n "$P3" ] && TOKEN="$P3"
          if [ -z "$TOKEN" ]; then
            echo "::warning::Brak PAT (PROGNOZA_MECZY_PAT / GITHUB_PAT / GH_PAT) — pomijam deploy do prognoza-meczy."
            echo "::warning::Wysyłka działa przez workflow „Prognoza-meczy wysyłka Gmail” w tym repo."
            echo "SKIP_DEPLOY=1" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "PROGNOZA_MECZY_PAT=$TOKEN" >> "$GITHUB_ENV"

      - name: Checkout prognoza-meczy
        if: env.SKIP_DEPLOY != '1'
        uses: actions/checkout@v4
        with:
          repository: Bigmax1993/prognoza-meczy
          token: ${{ env.PROGNOZA_MECZY_PAT }}
          path: prognoza-meczy

      - name: Zastosuj poprawkę wysyłki
        if: env.SKIP_DEPLOY != '1'
        run: python3 deploy/prognoza-meczy-send-mail/apply_fix.py prognoza-meczy

      - name: Commit i push na prognoza-meczy
        if: env.SKIP_DEPLOY != '1'
        working-directory: prognoza-meczy
        env:
          PROGNOZA_MECZY_PAT: ${{ env.PROGNOZA_MECZY_PAT }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Brak zmian — prognoza-meczy już ma poprawkę."
            exit 0
          fi
          git add .github/workflows/send-mail.yml scripts/fetch_predykcje_artifact.py tests/test_fetch_predykcje_artifact.py
          git commit -m "Fix send-mail workflow artifact download." \
            -m "Replace gh CLI artifact lookup with GitHub API helper, clearer errors when Sunday pipeline has not run yet, and optional allow_repo_fallback for manual workflow_dispatch testing."
          git push "https://x-access-token:${PROGNOZA_MECZY_PAT}@github.com/Bigmax1993/prognoza-meczy.git" HEAD:main
