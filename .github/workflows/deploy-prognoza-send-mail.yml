name: Deploy prognoza-meczy send-mail fix

on:
  push:
    branches: [main]
    paths:
      - "deploy/prognoza-meczy-send-mail/**"
      - ".github/workflows/deploy-prognoza-send-mail.yml"
  workflow_dispatch:
    inputs:
      deploy_token:
        description: "PAT (scope repo) do push na prognoza-meczy — gdy brak PROGNOZA_MECZY_PAT w Secrets"
        required: false
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Rozwiąż token deploy
        env:
          S0: ${{ inputs.deploy_token }}
          S1: ${{ secrets.PROGNOZA_MECZY_PAT }}
          S2: ${{ secrets.GITHUB_PAT }}
          S3: ${{ secrets.GH_PAT }}
          S4: ${{ secrets.PAT }}
          S5: ${{ secrets.GH_TOKEN }}
          S6: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          TOKEN=""
          for candidate in "$S0" "$S1" "$S2" "$S3" "$S4" "$S5" "$S6"; do
            if [ -n "$candidate" ]; then
              TOKEN="$candidate"
              break
            fi
          done
          if [ -z "$TOKEN" ]; then
            echo "::warning::Brak PAT w repo Automatyczne-wysylanie-meili."
            echo "::warning::Sekrety Gmail z prognoza-meczy NIE są widoczne tutaj — to osobne repozytoria."
            echo "::warning::Aby wypchnąć poprawkę: dodaj PROGNOZA_MECZY_PAT w Secrets LUB uruchom workflow_dispatch z polem deploy_token."
            echo "::warning::Aby wysłać mail teraz: uruchom „Wysyłka Gmail poniedziałek” w repo prognoza-meczy."
            echo "SKIP_DEPLOY=1" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "PROGNOZA_MECZY_PAT=$TOKEN" >> "$GITHUB_ENV"

      - name: Checkout prognoza-meczy
        if: env.SKIP_DEPLOY != '1'
        uses: actions/checkout@v4
        with:
          repository: Bigmax1993/prognoza-meczy
          token: ${{ env.PROGNOZA_MECZY_PAT }}
          path: prognoza-meczy

      - name: Zastosuj poprawkę wysyłki
        if: env.SKIP_DEPLOY != '1'
        run: python3 deploy/prognoza-meczy-send-mail/apply_fix.py prognoza-meczy

      - name: Commit i push na prognoza-meczy
        if: env.SKIP_DEPLOY != '1'
        working-directory: prognoza-meczy
        env:
          PROGNOZA_MECZY_PAT: ${{ env.PROGNOZA_MECZY_PAT }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Brak zmian — prognoza-meczy już ma poprawkę."
            exit 0
          fi
          git add .github/workflows/send-mail.yml .github/workflows/pipeline.yml scripts/fetch_predykcje_artifact.py tests/test_fetch_predykcje_artifact.py
          git commit -m "Fix send-mail workflow and clear cache JSON/logging on pipeline runs." \
            -m "Replace gh CLI artifact lookup with GitHub API helper; remove missing_data.json Actions cache; wipe cache/*.json, cache/*.log and logs/ before each pipeline run."
          git push "https://x-access-token:${PROGNOZA_MECZY_PAT}@github.com/Bigmax1993/prognoza-meczy.git" HEAD:main

  notify:
    if: always() && needs.deploy.result == 'success'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Podpowiedź po deploy
        run: |
          echo "Poprawka jest na prognoza-meczy. Uruchom: Actions → Wysyłka Gmail poniedziałek → Run workflow"
