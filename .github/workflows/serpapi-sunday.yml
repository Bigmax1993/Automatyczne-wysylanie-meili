name: SerpAPI Sunday Build

on:
  schedule:
    # 21:00 Europe/Warsaw (CEST, UTC+2) => 19:00 UTC
    - cron: "0 19 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  serpapi-build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      SERPAPI_DAILY_LIMIT_ENABLED: "0"
      SERPAPI_WEEKLY_REQUEST_LIMIT: "200"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build contacts with SerpAPI
        run: |
          mkdir -p generated
          python build_contacts_serpapi.py \
            --firm-target 1000 \
            --agency-target 1000 \
            --ecommerce-target 1000 \
            --cities "Wroclaw,Zielona Gora,Poznan" \
            --max-requests-per-group 800 \
            --pages-per-query 6 \
            --num-per-request 20 \
            --enrich-email \
            --output generated/Kontakty_serpapi.xlsx

      - name: Upload contacts artifact
        uses: actions/upload-artifact@v4
        with:
          name: kontakty-serpapi
          path: generated/Kontakty_serpapi.xlsx
          if-no-files-found: error

      - name: Commit generated contacts snapshot
        run: |
          if [ -f generated/Kontakty_serpapi.xlsx ]; then
            git add generated/Kontakty_serpapi.xlsx
            if ! git diff --cached --quiet; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "chore: update weekly SerpAPI contacts snapshot"
              git push
            fi
          fi
