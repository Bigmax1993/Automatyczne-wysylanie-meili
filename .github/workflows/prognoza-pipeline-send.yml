name: Prognoza Discovery A

on:
  schedule:
    - cron: "0 18 * * 0"
      timezone: "Europe/Warsaw"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: prognoza-discovery-a-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discovery-a:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONIOENCODING: utf-8
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || vars.ANTHROPIC_API_KEY }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY || vars.SERPER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout prognoza-meczy
        uses: actions/checkout@v4
        with:
          repository: Bigmax1993/prognoza-meczy
          path: prognoza-meczy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: prognoza-meczy/requirements.txt

      - uses: actions/cache@v4
        with:
          path: prognoza-meczy/cache/missing_data.json
          key: prognoza-missing-data-${{ github.run_id }}
          restore-keys: |
            prognoza-missing-data-

      - name: Zależności
        working-directory: prognoza-meczy
        run: pip install -r requirements.txt

      - name: Pobierz poprzednie artefakty predykcji
        working-directory: prognoza-meczy
        env:
          ACTIONS_REPO: Bigmax1993/Automatyczne-wysylanie-meili
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for WORKFLOW in prognoza-pipeline-send.yml prognoza-discovery-b.yml; do
            for RUN_ID in $(gh run list -R "$ACTIONS_REPO" --workflow "$WORKFLOW" --status success --limit 4 --json databaseId --jq '.[].databaseId'); do
              DEST="artifacts/run-${RUN_ID}"
              mkdir -p "$DEST"
              if gh run download -R "$ACTIONS_REPO" "$RUN_ID" --name predykcje-xlsx --dir "$DEST" 2>/dev/null; then
                cp "$DEST/predykcje_2026.xlsx" "artifacts/predykcje_prev_${RUN_ID}.xlsx"
                if [ ! -f artifacts/previous_predykcje_2026.xlsx ]; then
                  cp "$DEST/predykcje_2026.xlsx" artifacts/previous_predykcje_2026.xlsx
                fi
                echo "artifact run_id=$RUN_ID"
              fi
            done
          done
          ls -la artifacts || true

      - name: Discovery A (soft 4h limit)
        working-directory: prognoza-meczy
        run: |
          set -euo pipefail
          timeout --foreground --signal=TERM --kill-after=300 4h \
            python predykcje.py --fill-missing --refresh-upcoming --fill-days 7

      - name: Artifact Excel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: predykcje-xlsx
          path: prognoza-meczy/predykcje_2026.xlsx
          if-no-files-found: error
          retention-days: 7
