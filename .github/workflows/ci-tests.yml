name: CI Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install test dependencies
        run: python -m pip install pytest pytest-cov

      - name: Run unit / integration / regression tests
        run: |
          pytest --ignore=tests/e2e -v --tb=short

      - name: Run e2e tests
        run: |
          pytest tests/e2e/ -v --tb=short

