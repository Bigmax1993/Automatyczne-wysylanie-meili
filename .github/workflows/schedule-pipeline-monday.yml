# Poniedzialkowy pipeline — osobny plik z jednym cronem (UTC jak wczesniej w main.yml).
name: Scheduled Pipeline (Monday)

permissions:
  contents: read

concurrency:
  group: scheduled-pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: "0 2 * * 1"

jobs:
  test-python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run pytest
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          DRY_RUN: "1"
        run: python -m pytest tests -v --tb=short

  test-powershell:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Pester tests
        shell: pwsh
        env:
          REPO_ROOT: ${{ github.workspace }}
        run: |
          $ProgressPreference = "SilentlyContinue"
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          Install-Module Pester -RequiredVersion 4.10.1 -Force -SkipPublisherCheck -Scope CurrentUser -AllowClobber
          Remove-Module Pester -Force -ErrorAction SilentlyContinue
          Import-Module Pester -RequiredVersion 4.10.1 -Force
          if ((Get-Module Pester).Version.ToString() -ne "4.10.1") {
            throw "Oczekiwano Pester 4.10.1, jest: $((Get-Module Pester).Version)"
          }
          Set-Location -LiteralPath $env:REPO_ROOT
          $r1 = Invoke-Pester -Path ".\tests\powershell\RunPipeline.Tests.ps1" -PassThru
          $r2 = Invoke-Pester -Path ".\tests\powershell\RunWithEnv.Tests.ps1" -PassThru
          $failed = [int]$r1.FailedCount + [int]$r2.FailedCount
          if ($failed -gt 0) { exit $failed }

  pipeline:
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.test-python.result == 'success' &&
      needs.test-powershell.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 180
    needs: [test-python, test-powershell]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare input sample
        shell: pwsh
        run: |
          $docsDir = Join-Path $env:USERPROFILE "Documents"
          $kontaktyDir = Join-Path $docsDir "kontakty"
          New-Item -ItemType Directory -Path $kontaktyDir -Force | Out-Null
          @"
          company_name,email,phone,url,source_query
          Test Company,test@example.com,,https://example.com,test query
          "@ | Out-File -FilePath (Join-Path $kontaktyDir "sample.csv") -Encoding utf8

      - name: Run pipeline
        shell: pwsh
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_SENDER_EMAIL: ${{ secrets.GMAIL_SENDER_EMAIL }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          PIPELINE_PYTHON_EXE: python
        run: |
          $skipBuild = "-SkipBuild"
          $dryRun = "-DryRun"
          $args = @()
          if ($skipBuild) { $args += $skipBuild }
          if ($dryRun) { $args += $dryRun }
          ./run_pipeline.ps1 @args

      - name: Upload pipeline JSON backups
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-json-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ~/Documents/pipeline_json_backups/*.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload pipeline logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ~/Documents/pipeline_logs/*.log
          if-no-files-found: ignore
          retention-days: 30
