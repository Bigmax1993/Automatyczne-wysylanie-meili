name: Monday-Saturday Pipeline Run

on:
  schedule:
    # 04:00 Europe/Warsaw (CEST, UTC+2) => 02:00 UTC
    # Mon-Sat
    - cron: "0 2 * * 1-6"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  clean-validate-send:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      GMAIL_SENDER_EMAIL: ${{ secrets.GMAIL_SENDER_EMAIL }}
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY || secrets.SERP_API_KEY || vars.SERPAPI_API_KEY }}
      # Wysyłka dzienna; baza z niedzieli jest budowana z limitem ~200 zapytań SerpAPI (skrypt serpapi-sunday).
      MAX_EMAILS_PER_DAY: "40"
      DRY_RUN: "1"
      EXTRA_CONTACTS_DIR: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download latest Sunday contacts artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: serpapi-sunday.yml
          branch: main
          name: kontakty-serpapi
          path: generated
          if_no_artifact_found: warn

      - name: Verify Sunday contacts file exists
        run: |
          test -f generated/Kontakty_serpapi.xlsx || {
            echo "Brak generated/Kontakty_serpapi.xlsx. Najpierw uruchom workflow SerpAPI."
            exit 1
          }

      - name: Run clean/validate/send
        run: |
          python clean_validate_send_pipeline.py \
            --input generated/Kontakty_serpapi.xlsx \
            --output-csv generated/Kontakty_cleaned.csv \
            --skip-extra-contacts \
            --dry-run

      - name: Upload cleaned CSV artifact
        uses: actions/upload-artifact@v6
        with:
          name: kontakty-cleaned
          path: generated/Kontakty_cleaned.csv
          if-no-files-found: error
