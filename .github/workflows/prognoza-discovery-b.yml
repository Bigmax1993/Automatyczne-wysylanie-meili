name: Prognoza Discovery B

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prognoza-discovery-b.yml"
  schedule:
    - cron: "0 2 * * 1"
      timezone: "Europe/Warsaw"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: prognoza-discovery-b-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discovery-b:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONIOENCODING: utf-8
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout prognoza-meczy
        uses: actions/checkout@v4
        with:
          repository: Bigmax1993/prognoza-meczy
          path: prognoza-meczy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: prognoza-meczy/requirements.txt

      - uses: actions/cache@v4
        with:
          path: prognoza-meczy/cache/missing_data.json
          key: prognoza-missing-data-${{ github.run_id }}
          restore-keys: |
            prognoza-missing-data-

      - name: Zależności
        working-directory: prognoza-meczy
        run: pip install -r requirements.txt

      - name: Pobierz poprzednie artefakty predykcji
        working-directory: prognoza-meczy
        env:
          ACTIONS_REPO: Bigmax1993/Automatyczne-wysylanie-meili
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for WORKFLOW in prognoza-discovery-b.yml prognoza-pipeline-send.yml; do
            for RUN_ID in $(gh run list -R "$ACTIONS_REPO" --workflow "$WORKFLOW" --status success --limit 6 --json databaseId --jq '.[].databaseId'); do
              DEST="artifacts/run-${RUN_ID}"
              mkdir -p "$DEST"
              if gh run download -R "$ACTIONS_REPO" "$RUN_ID" --name predykcje-xlsx --dir "$DEST" 2>/dev/null; then
                cp "$DEST/predykcje_2026.xlsx" "artifacts/predykcje_prev_${RUN_ID}.xlsx"
                if [ ! -f artifacts/previous_predykcje_2026.xlsx ]; then
                  cp "$DEST/predykcje_2026.xlsx" artifacts/previous_predykcje_2026.xlsx
                fi
                echo "artifact run_id=$RUN_ID"
              fi
            done
          done
          ls -la artifacts || true

      - name: Discovery B (2x2h, stopniowe luzowanie)
        working-directory: prognoza-meczy
        run: |
          set -euo pipefail
          run_phase () {
            local label="$1"
            shift
            echo "=== ${label} ==="
            timeout --foreground --signal=TERM --kill-after=120 2h python predykcje.py "$@"
          }

          set +e
          run_phase "B1: fresh window" --fill-missing --refresh-upcoming --fill-days 7
          PHASE1_CODE=$?
          if [ "$PHASE1_CODE" -ne 0 ]; then
            echo "::warning::B1 zakonczyl sie kodem ${PHASE1_CODE}; uruchamiam B2 z szerszym zakresem."
          fi
          run_phase "B2: deep backlog" --fill-missing --no-upcoming --fill-days 30
          PHASE2_CODE=$?
          set -e
          if [ "$PHASE2_CODE" -ne 0 ]; then
            if [ -f predykcje_2026.xlsx ]; then
              echo "::warning::B2 zakonczyl sie kodem ${PHASE2_CODE}, ale plik predykcje_2026.xlsx jest gotowy."
            else
              echo "::error::B2 zakonczyl sie kodem ${PHASE2_CODE} i brak pliku predykcje_2026.xlsx."
              exit "$PHASE2_CODE"
            fi
          fi

      - name: Artifact Excel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: predykcje-xlsx
          path: prognoza-meczy/predykcje_2026.xlsx
          if-no-files-found: error
          retention-days: 7
