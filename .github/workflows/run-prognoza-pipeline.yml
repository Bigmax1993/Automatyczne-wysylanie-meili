# Pełny pipeline prognoza-meczy uruchamiany z tego repo (sekrety z Automatyczne-wysylanie-meili).
name: Prognoza-meczy pełny pipeline

on:
  workflow_dispatch:
    inputs:
      skip_send:
        description: "Tylko predykcje, bez wysyłki maila"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - ".github/workflows/run-prognoza-pipeline.yml"
      - "deploy/prognoza-meczy-send-mail/.run-pipeline"

permissions:
  contents: read

jobs:
  predykcje:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONIOENCODING: utf-8
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
    steps:
      - name: Checkout prognoza-meczy
        uses: actions/checkout@v4
        with:
          repository: Bigmax1993/prognoza-meczy
          path: prognoza-meczy

      - name: Wyczyść cache JSON i logi
        working-directory: prognoza-meczy
        run: |
          set -euo pipefail
          rm -f cache/*.json cache/*.log 2>/dev/null || true
          rm -rf logs/* 2>/dev/null || true
          mkdir -p cache logs
          echo "Wyczyszczono cache/*.json, cache/*.log oraz logs/"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: prognoza-meczy/requirements.txt

      - name: Zależności
        working-directory: prognoza-meczy
        run: pip install -r requirements.txt

      - name: Uruchom predykcje.py --fill-missing
        working-directory: prognoza-meczy
        run: python predykcje.py --fill-missing

      - name: Artifact Excel
        uses: actions/upload-artifact@v4
        with:
          name: predykcje-xlsx-${{ github.run_id }}
          path: prognoza-meczy/predykcje_2026.xlsx
          if-no-files-found: error
          retention-days: 7

  send:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_send != true }}
    needs: predykcje
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Uruchom wysyłkę w prognoza-meczy (sekrety Gmail są tam)
        env:
          S1: ${{ secrets.PROGNOZA_MECZY_PAT }}
          S2: ${{ secrets.GITHUB_PAT }}
          S3: ${{ secrets.GH_PAT }}
          S4: ${{ secrets.PAT }}
        run: |
          set -euo pipefail
          TOKEN=""
          for candidate in "$S1" "$S2" "$S3" "$S4"; do
            [ -n "$candidate" ] && TOKEN="$candidate" && break
          done
          if [ -z "$TOKEN" ]; then
            echo "::warning::Brak PAT — nie mogę uruchomić wysyłki w prognoza-meczy z tego workflow."
            echo "::warning::Predykcje zakończone OK. Uruchom ręcznie:"
            echo "::warning::https://github.com/Bigmax1993/prognoza-meczy/actions/workflows/send-mail.yml"
            exit 0
          fi
          code=$(curl -s -o /tmp/send_dispatch.json -w "%{http_code}" -X POST \
            -H "Authorization: token ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Bigmax1993/prognoza-meczy/actions/workflows/send-mail.yml/dispatches" \
            -d '{"ref":"main"}')
          if [ "$code" != "204" ]; then
            echo "::error::Nie udało się uruchomić wysyłki (HTTP $code)"
            cat /tmp/send_dispatch.json
            exit 1
          fi
          echo "Uruchomiono Wysyłka Gmail poniedziałek w prognoza-meczy."

      - name: Czekaj na zakończenie wysyłki w prognoza-meczy
        env:
          S1: ${{ secrets.PROGNOZA_MECZY_PAT }}
          S2: ${{ secrets.GITHUB_PAT }}
          S3: ${{ secrets.GH_PAT }}
          S4: ${{ secrets.PAT }}
        run: |
          set -euo pipefail
          TOKEN=""
          for candidate in "$S1" "$S2" "$S3" "$S4"; do
            [ -n "$candidate" ] && TOKEN="$candidate" && break
          done
          [ -z "$TOKEN" ] && echo "Pominięto monitorowanie (brak PAT)." && exit 0
          for i in $(seq 1 30); do
            RUN=$(curl -s -H "Authorization: token ${TOKEN}" \
              "https://api.github.com/repos/Bigmax1993/prognoza-meczy/actions/workflows/send-mail.yml/runs?per_page=1" \
              | python3 -c "import sys,json; r=json.load(sys.stdin)['workflow_runs'][0]; print(r['status'], r.get('conclusion') or '-', r['html_url'])")
            echo "[$i/30] send-mail: $RUN"
            STATUS=$(echo "$RUN" | awk '{print $1}')
            CONCLUSION=$(echo "$RUN" | awk '{print $2}')
            if [ "$STATUS" = "completed" ]; then
              [ "$CONCLUSION" = "success" ] && exit 0
              echo "::error::Wysyłka w prognoza-meczy zakończona: $CONCLUSION"
              exit 1
            fi
            sleep 10
          done
          echo "::error::Timeout oczekiwania na wysyłkę w prognoza-meczy"
          exit 1
