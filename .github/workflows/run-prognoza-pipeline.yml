# Pełny pipeline prognoza-meczy: predykcje + wysyłka Gmail (nigdy nie pomijana).
name: Prognoza-meczy pełny pipeline

on:
  workflow_dispatch:
    inputs:
      skip_send:
        description: "Tylko predykcje, bez wysyłki maila"
        required: false
        default: false
        type: boolean
      gmail_app_password:
        description: "Awaryjnie: hasło aplikacji Gmail (gdy brak w Secrets)"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/run-prognoza-pipeline.yml"
      - "deploy/prognoza-meczy-send-mail/.run-pipeline"

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PYTHONIOENCODING: utf-8
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      PROGNOZA_REPO: Bigmax1993/prognoza-meczy
      # Domyślne adresy z README prognoza-meczy (publiczne — nie są sekretem)
      DEFAULT_GMAIL_USER: svinchak1993@gmail.com
      DEFAULT_MAIL_TO: Swinczakaleksy@gmail.com
    steps:
      - name: Checkout prognoza-meczy
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PROGNOZA_REPO }}
          path: prognoza-meczy

      - name: Wyczyść cache JSON i logi
        working-directory: prognoza-meczy
        run: |
          set -euo pipefail
          rm -f cache/*.json cache/*.log 2>/dev/null || true
          rm -rf logs/* 2>/dev/null || true
          mkdir -p cache logs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: prognoza-meczy/requirements.txt

      - name: Zależności
        working-directory: prognoza-meczy
        run: pip install -r requirements.txt

      - name: Uruchom predykcje.py --fill-missing
        working-directory: prognoza-meczy
        run: python predykcje.py --fill-missing

      - name: Artifact Excel
        uses: actions/upload-artifact@v4
        with:
          name: predykcje-xlsx-${{ github.run_id }}
          path: prognoza-meczy/predykcje_2026.xlsx
          if-no-files-found: error
          retention-days: 7

      - name: Wyślij mail (wymagane)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_send != true }}
        env:
          INPUT_GMAIL_PASSWORD: ${{ inputs.gmail_app_password }}
          GU1: ${{ secrets.GMAIL_USER }}
          GU2: ${{ secrets.GMAIL_SENDER_EMAIL }}
          GU3: ${{ secrets.SENDER_EMAIL }}
          GP1: ${{ secrets.GMAIL_APP_PASSWORD }}
          GP2: ${{ secrets.GMAIL_PASSWORD }}
          GP3: ${{ secrets.GMAIL_APP_PASS }}
          MT1: ${{ secrets.MAIL_TO }}
          MT2: ${{ secrets.EMAIL_TO }}
          MT3: ${{ secrets.RECIPIENT_EMAIL }}
          P1: ${{ secrets.PROGNOZA_MECZY_PAT }}
          P2: ${{ secrets.GITHUB_PAT }}
          P3: ${{ secrets.GH_PAT }}
          P4: ${{ secrets.PAT }}
          P5: ${{ secrets.GH_TOKEN }}
          P6: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          XLSX="prognoza-meczy/predykcje_2026.xlsx"
          test -f "$XLSX"

          resolve_first() {
            for v in "$@"; do
              [ -n "$v" ] && { printf '%s' "$v"; return 0; }
            done
            return 1
          }

          export GMAIL_USER="$(resolve_first "$GU1" "$GU2" "$GU3" "$DEFAULT_GMAIL_USER")"
          export MAIL_TO="$(resolve_first "$MT1" "$MT2" "$MT3" "$DEFAULT_MAIL_TO")"
          export GMAIL_APP_PASSWORD="$(resolve_first "$INPUT_GMAIL_PASSWORD" "$GP1" "$GP2" "$GP3" || true)"
          PAT="$(resolve_first "$P1" "$P2" "$P3" "$P4" "$P5" "$P6" || true)"

          send_local() {
            [ -n "$GMAIL_APP_PASSWORD" ] || return 1
            python prognoza-meczy/send_mail.py --plik "$XLSX"
            echo "Wysłano mail (SMTP z tego workflow)."
          }

          send_via_prognoza_meczy() {
            [ -n "$PAT" ] || return 1
            echo "Wysyłka przez prognoza-meczy (sekrety Gmail są w tamtym repo)..."
            work="$(mktemp -d)"
            git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
              clone --depth 1 "https://x-access-token:${PAT}@github.com/${PROGNOZA_REPO}.git" "$work/repo"
            cp "$XLSX" "$work/repo/predykcje_2026.xlsx"
            base="https://raw.githubusercontent.com/Bigmax1993/Automatyczne-wysylanie-meili/main/deploy/prognoza-meczy-send-mail"
            mkdir -p "$work/repo/.github/workflows" "$work/repo/scripts" "$work/repo/tests"
            curl -fsSL "$base/.github/workflows/send-mail.yml" -o "$work/repo/.github/workflows/send-mail.yml"
            curl -fsSL "$base/scripts/fetch_predykcje_artifact.py" -o "$work/repo/scripts/fetch_predykcje_artifact.py"
            cd "$work/repo"
            git add predykcje_2026.xlsx .github/workflows/send-mail.yml scripts/fetch_predykcje_artifact.py
            if ! git diff --staged --quiet; then
              git commit -m "ci: świeże predykcje + poprawka send-mail [skip ci]"
              git push origin main
            fi
            code=$(curl -s -o /tmp/send_dispatch.json -w "%{http_code}" -X POST \
              -H "Authorization: token ${PAT}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${PROGNOZA_REPO}/actions/workflows/send-mail.yml/dispatches" \
              -d '{"ref":"main","inputs":{"allow_repo_fallback":"true"}}')
            if [ "$code" != "204" ]; then
              echo "::error::Dispatch send-mail HTTP $code"
              cat /tmp/send_dispatch.json
              return 1
            fi
            for i in $(seq 1 36); do
              RUN=$(curl -s -H "Authorization: token ${PAT}" \
                "https://api.github.com/repos/${PROGNOZA_REPO}/actions/workflows/send-mail.yml/runs?per_page=1" \
                | python3 -c "import sys,json; r=json.load(sys.stdin)['workflow_runs'][0]; print(r['status'], r.get('conclusion') or '-', r['html_url'])")
              echo "[$i/36] $RUN"
              STATUS=$(echo "$RUN" | awk '{print $1}')
              CONCLUSION=$(echo "$RUN" | awk '{print $2}')
              if [ "$STATUS" = "completed" ]; then
                [ "$CONCLUSION" = "success" ] && return 0
                echo "::error::send-mail: $CONCLUSION ($RUN)"
                return 1
              fi
              sleep 10
            done
            return 1
          }

          if send_local; then exit 0; fi
          if send_via_prognoza_meczy; then exit 0; fi

          echo "::error::WYSYŁKA NIEUDANA."
          echo "::error::Sekrety Gmail są w repo prognoza-meczy — GitHub NIE udostępnia ich innemu repo."
          echo "::error::Dodaj JEDEN sekret w Automatyczne-wysylanie-meili → Settings → Secrets:"
          echo "::error::  • GMAIL_APP_PASSWORD  LUB  • PROGNOZA_MECZY_PAT (token repo do prognoza-meczy)"
          exit 1
