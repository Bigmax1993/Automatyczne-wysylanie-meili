# Pełny pipeline prognoza-meczy: predykcje + wysyłka Gmail (bez pomijania wysyłki).
name: Prognoza-meczy pełny pipeline

on:
  workflow_dispatch:
    inputs:
      skip_send:
        description: "Tylko predykcje, bez wysyłki maila (wyłącznie ręcznie)"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - ".github/workflows/run-prognoza-pipeline.yml"
      - "deploy/prognoza-meczy-send-mail/.run-pipeline"

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PYTHONIOENCODING: utf-8
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
    steps:
      - name: Checkout prognoza-meczy
        uses: actions/checkout@v4
        with:
          repository: Bigmax1993/prognoza-meczy
          path: prognoza-meczy

      - name: Wyczyść cache JSON i logi
        working-directory: prognoza-meczy
        run: |
          set -euo pipefail
          rm -f cache/*.json cache/*.log 2>/dev/null || true
          rm -rf logs/* 2>/dev/null || true
          mkdir -p cache logs
          echo "Wyczyszczono cache/*.json, cache/*.log oraz logs/"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: prognoza-meczy/requirements.txt

      - name: Zależności
        working-directory: prognoza-meczy
        run: pip install -r requirements.txt

      - name: Uruchom predykcje.py --fill-missing
        working-directory: prognoza-meczy
        run: python predykcje.py --fill-missing

      - name: Artifact Excel
        uses: actions/upload-artifact@v4
        with:
          name: predykcje-xlsx-${{ github.run_id }}
          path: prognoza-meczy/predykcje_2026.xlsx
          if-no-files-found: error
          retention-days: 7

      - name: Wyślij mail (wymagane)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_send != true }}
        working-directory: prognoza-meczy
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_SENDER_EMAIL: ${{ secrets.GMAIL_SENDER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          set -euo pipefail
          USER="${GMAIL_USER:-$GMAIL_SENDER_EMAIL}"
          missing=""
          [ -z "$USER" ] && missing="${missing} GMAIL_USER lub GMAIL_SENDER_EMAIL"
          [ -z "$GMAIL_APP_PASSWORD" ] && missing="${missing} GMAIL_APP_PASSWORD"
          [ -z "$MAIL_TO" ] && missing="${missing} MAIL_TO"
          if [ -n "$missing" ]; then
            echo "::error::Brak sekretów Gmail w repo Automatyczne-wysylanie-meili:$missing"
            echo "::error::Wysyłka NIE może być pominięta. Skopiuj sekrety z prognoza-meczy:"
            echo "::error::Settings → Secrets → Actions → GMAIL_USER, GMAIL_APP_PASSWORD, MAIL_TO"
            exit 1
          fi
          export GMAIL_USER="$USER"
          test -f predykcje_2026.xlsx
          python send_mail.py --plik predykcje_2026.xlsx
          echo "Wysłano mail z predykcje_2026.xlsx"
