# Poniedziałek 02:00 czasu polskiego (CEST = UTC+2). Zimą (CET) będzie 03:00.
# GitHub Actions cron jest zawsze w UTC.
name: Wysyłka Gmail poniedziałek

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      allow_repo_fallback:
        description: "Gdy brak artifactu pipeline — użyj predykcje_2026.xlsx z repo (tylko testy)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONIOENCODING: utf-8
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Pobierz Excel z niedzielnego pipeline
        run: |
          set -euo pipefail
          ARGS=(
            --repo "${{ github.repository }}"
            --branch main
            --dest predykcje_2026.xlsx
          )
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.allow_repo_fallback }}" = "true" ]; then
            ARGS+=(--fallback predykcje_2026.xlsx)
          fi
          python scripts/fetch_predykcje_artifact.py "${ARGS[@]}"
          test -f predykcje_2026.xlsx

      - name: Wyślij mail
        run: python send_mail.py --plik predykcje_2026.xlsx
