# Niedziela 20:00 czasu polskiego (CEST = UTC+2). Zimą (CET) będzie 21:00.
# GitHub Actions cron jest zawsze w UTC.
name: Pipeline niedziela

on:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PYTHONIOENCODING: utf-8
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
    steps:
      - uses: actions/checkout@v4

      - name: Wyczyść cache JSON i logi
        run: |
          set -euo pipefail
          rm -f cache/*.json cache/*.log 2>/dev/null || true
          rm -rf logs/* 2>/dev/null || true
          mkdir -p cache logs
          echo "Wyczyszczono cache/*.json, cache/*.log oraz logs/"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Zależności
        run: pip install -r requirements.txt

      - name: Uruchom pipeline
        run: python predykcje.py --fill-missing

      - name: Artifact Excel
        uses: actions/upload-artifact@v4
        with:
          name: predykcje-xlsx
          path: predykcje_2026.xlsx
          if-no-files-found: error
          retention-days: 7

      - name: Wyślij mail (wymagane)
        run: |
          set -euo pipefail
          missing=""
          [ -z "$GMAIL_USER" ] && missing="${missing} GMAIL_USER"
          [ -z "$GMAIL_APP_PASSWORD" ] && missing="${missing} GMAIL_APP_PASSWORD"
          [ -z "$MAIL_TO" ] && missing="${missing} MAIL_TO"
          if [ -n "$missing" ]; then
            echo "::error::Brak sekretów Gmail w prognoza-meczy:$missing"
            exit 1
          fi
          test -f predykcje_2026.xlsx
          python send_mail.py --plik predykcje_2026.xlsx
          echo "Wysłano mail z predykcje_2026.xlsx"
