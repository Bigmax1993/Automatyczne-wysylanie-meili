# Wklej ten plik w prognoza-meczy jako .github/workflows/fix-send-mail-once.yml
# i uruchom raz ręcznie (Run workflow). Nie wymaga PAT — używa GITHUB_TOKEN.
name: Fix send-mail once

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Napraw send-mail.yml
        run: |
          set -euo pipefail
          FILE=".github/workflows/send-mail.yml"
          if grep -q 'rm -f predykcje_2026.xlsx' "$FILE"; then
            echo "Poprawka już jest w send-mail.yml"
          else
            python3 <<'PY'
          from pathlib import Path
          p = Path(".github/workflows/send-mail.yml")
          text = p.read_text()
          needle = "          set -euo pipefail\n"
          insert = needle + "          rm -f predykcje_2026.xlsx\n"
          if needle not in text:
              raise SystemExit("Nie znaleziono oczekiwanego bloku w send-mail.yml")
          p.write_text(text.replace(needle, insert, 1))
          PY
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$FILE"
            git commit -m "Fix send-mail: remove stale xlsx before artifact download."
            git push
          fi

      - name: Uruchom wysyłkę
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run send-mail.yml --ref main
          echo "Uruchomiono Wysyłka Gmail poniedziałek"
